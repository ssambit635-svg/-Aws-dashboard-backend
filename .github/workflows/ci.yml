name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types & tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]

    env:
      # The suite must never need real cloud credentials.
      DASH_PROVIDER_MODE: mock
      DASH_API_KEY: ci-test-key
      DASH_ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -q

  docker:
    name: Docker image builds & serves
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t cloud-control-api:ci .

      - name: Boot container and probe health
        run: |
          docker run -d --name cc -p 8000:8000 \
            -e DASH_ENVIRONMENT=local \
            -e DASH_PROVIDER_MODE=mock \
            -e DASH_API_KEY=ci-test-key \
            cloud-control-api:ci
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/livez > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/readyz
          curl -sf -H "X-API-Key: ci-test-key" http://localhost:8000/api/v1/overview > /dev/null
          curl -sf http://localhost:8000/ | grep -q "Cloud Control"

      - name: Container logs
        if: failure()
        run: docker logs cc

      - name: Tear down
        if: always()
        run: docker rm -f cc || true
